<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Entre em Contato</h1>

    <form>

        <br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
